<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Vector 語者比對</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "/ort/ort.wasm.min.mjs" } }
</script>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e0; --accent:#2f6fde; --ok:#1f8a4c; --bad:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e21; --fg:#ececee; --muted:#9a9aa2; --line:#33333a; --accent:#6b9cff; --ok:#4cc382; --bad:#ff8a5c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .slots { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px) { .slots { grid-template-columns:1fr; } }
  .slot { background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:20px; cursor:pointer; min-height:150px; display:flex; flex-direction:column; gap:8px; }
  .slot.drag { border-color:var(--accent); }
  .slot.filled { border-style:solid; }
  .slot b { font-size:.85rem; color:var(--muted); letter-spacing:.05em; }
  .slot .name { font-weight:600; word-break:break-all; }
  .slot .meta { color:var(--muted); font-size:.9rem; }
  .slot audio { width:100%; margin-top:auto; }
  input[type=file] { display:none; }
  .actions { display:flex; gap:8px; }
  .actions button { font:inherit; font-size:.9rem; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  .actions button.rec { border-color:var(--bad); color:var(--bad); }
  .actions button:disabled { opacity:.5; cursor:default; }
  .result { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  .verdict { font-size:1.4rem; font-weight:700; }
  .verdict.same { color:var(--ok); } .verdict.diff { color:var(--bad); }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .nums div { border-top:1px solid var(--line); padding-top:8px; }
  .nums span { display:block; color:var(--muted); font-size:.85rem; }
  .nums strong { font-size:1.25rem; font-variant-numeric:tabular-nums; }
  .status { color:var(--muted); margin-top:16px; min-height:1.5em; }
  label.opt { display:flex; gap:8px; align-items:center; margin-top:16px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>X-Vector 語者比對</h1>
  <p class="sub">上傳兩段音檔 (wav / mp3 / m4a / ogg…)，在瀏覽器內以 WASM 離線計算是否為同一人，音檔不會上傳到任何伺服器。</p>

  <div class="slots">
    <div class="slot" data-i="0"><b>音檔 A</b><div class="name">點擊或拖放音檔，或直接錄音</div><div class="meta"></div></div>
    <div class="slot" data-i="1"><b>音檔 B</b><div class="name">點擊或拖放音檔，或直接錄音</div><div class="meta"></div></div>
  </div>
  <label class="opt"><input type="checkbox" id="snorm" checked> 使用 S-Norm (與 API 預設相同)</label>

  <div class="result" id="result" hidden>
    <div class="verdict" id="verdict"></div>
    <div class="nums">
      <div><span>Cosine Similarity</span><strong id="raw">–</strong></div>
      <div><span>S-Norm 分數</span><strong id="sn">–</strong></div>
      <div><span>判定門檻</span><strong id="th">–</strong></div>
    </div>
  </div>
  <div class="status" id="status">模型載入中…</div>
</main>

<script type="module">
import * as ort from 'onnxruntime-web';
import { SpeakerEncoder, decodeAudio, preprocess, SAMPLE_RATE } from '/src/index.js';

const $ = (id) => document.getElementById(id);
const status = (t) => ($('status').textContent = t);
const embeddings = [null, null];
let withCohort, plain;

try {
  ort.env.wasm.wasmPaths = '/ort/';
  withCohort = await SpeakerEncoder.create('/models/xvector_v14.onnx', { cohort: '/models/cohort.bin' });
  plain = new SpeakerEncoder(withCohort.session);
  status('模型已載入，請上傳兩段音檔。');
} catch (e) {
  status('模型載入失敗：' + e.message);
}

async function handle(i, file, slot) {
  slot.classList.add('filled');
  slot.querySelector('.name').textContent = file.name;
  slot.querySelector('audio')?.remove();
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = URL.createObjectURL(file);
  slot.append(audio);
  embeddings[i] = null;
  status(`分析 ${file.name} …`);
  try {
    const wav = preprocess(await decodeAudio(file));
    const t0 = performance.now();
    embeddings[i] = await withCohort.embed(wav);
    const ms = performance.now() - t0;
    slot.querySelector('.meta').textContent = `${(wav.length / SAMPLE_RATE).toFixed(1)} 秒・推論 ${ms.toFixed(0)} ms`;
    status('');
    render();
  } catch (e) {
    slot.querySelector('.meta').textContent = '';
    status(`無法處理 ${file.name}：${e.message}`);
  }
}

function render() {
  if (!embeddings[0] || !embeddings[1]) return;
  const s = ($('snorm').checked ? withCohort : plain).score(embeddings[0], embeddings[1]);
  $('result').hidden = false;
  $('verdict').textContent = s.is_same_person ? '判定：同一人' : '判定：不同人';
  $('verdict').className = 'verdict ' + (s.is_same_person ? 'same' : 'diff');
  $('raw').textContent = s.raw_score.toFixed(4);
  $('sn').textContent = s.snorm_score == null ? '–' : s.snorm_score.toFixed(2);
  $('th').textContent = s.threshold;
}
$('snorm').addEventListener('change', render);

// 錄音：再按一次停止，錄好的音檔與上傳的檔案走相同流程
let recording = null;
async function toggleRecord(i, slot, btn) {
  if (recording) {
    if (recording.btn === btn) recording.recorder.stop();
    return;
  }
  let stream;
  try {
    // 關閉瀏覽器的音訊處理，讓輸入盡量接近訓練資料的原始錄音
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (e) {
    status('無法使用麥克風：' + e.message);
    return;
  }
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  const start = performance.now();
  const timer = setInterval(() => {
    btn.textContent = `■ 停止 ${((performance.now() - start) / 1000).toFixed(0)}s`;
  }, 250);
  recording = { recorder, btn };
  document.querySelectorAll('.actions button').forEach((b) => (b.disabled = b !== btn));
  btn.classList.add('rec');
  btn.textContent = '■ 停止 0s';
  status('錄音中，建議至少說 3 秒…');

  recorder.addEventListener('dataavailable', (e) => chunks.push(e.data));
  recorder.addEventListener('stop', () => {
    clearInterval(timer);
    stream.getTracks().forEach((t) => t.stop());
    recording = null;
    document.querySelectorAll('.actions button').forEach((b) => (b.disabled = false));
    btn.classList.remove('rec');
    btn.textContent = '● 重新錄音';
    const type = recorder.mimeType || 'audio/webm';
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    const file = new File(chunks, `錄音 ${'AB'[i]}.${ext}`, { type });
    handle(i, file, slot);
  });
  recorder.start();
}

document.querySelectorAll('.slot').forEach((slot) => {
  const i = Number(slot.dataset.i);
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: 'audio/*' });
  slot.append(input);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const recBtn = Object.assign(document.createElement('button'), { type: 'button', textContent: '● 錄音' });
  actions.append(recBtn);
  slot.querySelector('.meta').after(actions);
  recBtn.addEventListener('click', () => toggleRecord(i, slot, recBtn));

  slot.addEventListener('click', (e) => {
    if (e.target.tagName !== 'AUDIO' && !e.target.closest('.actions')) input.click();
  });
  input.addEventListener('change', () => input.files[0] && handle(i, input.files[0], slot));
  slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('drag'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('drag'));
  slot.addEventListener('drop', (e) => {
    e.preventDefault(); slot.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) handle(i, f, slot);
  });
});
</script>
</body>
</html>
